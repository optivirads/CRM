name: OptiVir CRM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Security & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Run Security & Integration Tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_32_characters_minimum_len
          INTEGRATION_ENCRYPTION_KEY: 846180dde65cda5077f6ee273e2f96ca4ad4c9c62c8ce5073fdc820e949d1274

  frontend-checks:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build Next.js App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
